name: ci

on:
  pull_request:
  push:
    branches: [codex/validate-api49-20261107-7KJEfk]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5aeca6d2db5bd02e3b8cef1983f2da005def1bbc
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install --upgrade pip uv

      - name: Sync deps
        run: uv pip install --system -e ".[dev]"

      - name: Install aiosqlite (migration tests)
        run: pip install aiosqlite

      - name: Ruff check
        run: ruff check .

      - name: Pytest (with coverage gate)
        run: pytest -q --cov=app --cov-report=term-missing

  # OpenAPI breaking-change gate. agent-middleware-api integrates against this
  # API surface (its human-approval gate + permit-request flow), so a breaking
  # schema change here breaks a production consumer even with zero shared code.
  # Hard gate on purpose — unlike third-party advisories (pip-audit above),
  # a breaking change to our own spec is always authored in the PR being
  # tested, so it is always actionable by that PR's author.
  # Intentional API change? Regenerate the baseline in the same PR:
  #   python -c 'import json; from app.main import app; print(json.dumps(app.openapi(), indent=2, sort_keys=True))' > docs/openapi.baseline.json
  # and flag the PR for a coordinated agent-middleware-api update.
  # Behavioral (non-schema) contract points are pinned separately in
  # tests/test_middleware_contract.py.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5aeca6d2db5bd02e3b8cef1983f2da005def1bbc
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install --upgrade pip uv

      - name: Sync deps
        run: uv pip install --system -e ".[dev]"

      - name: Generate current OpenAPI spec
        run: python -c 'import json; from app.main import app; print(json.dumps(app.openapi(), indent=2, sort_keys=True))' > /tmp/openapi.current.json

      - name: oasdiff (breaking-change gate vs committed baseline)
        run: |
          curl -sSL https://github.com/oasdiff/oasdiff/releases/download/v1.28.0/oasdiff_1.28.0_linux_amd64.tar.gz | tar -xz -C /tmp oasdiff
          /tmp/oasdiff breaking docs/openapi.baseline.json /tmp/openapi.current.json --fail-on ERR

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5aeca6d2db5bd02e3b8cef1983f2da005def1bbc
          fetch-depth: 0   # gitleaks needs full history to scan past commits

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install --upgrade pip uv

      # Dependency advisory scan. Resolves the project's dependency tree from
      # pyproject.toml and checks it against the PyPI advisory database (OSV).
      # Day-one policy: continue-on-error so a newly disclosed advisory in an
      # existing/transitive dependency does NOT instantly red-line main for the
      # whole team. The result stays visible in the job log; we triage and pin.
      # Local dry run on this branch: "No known vulnerabilities found".
      - name: pip-audit (dependency advisories)
        continue-on-error: true
        run: uvx pip-audit .

      # Secret scan. Hard gate: a clean repo must stay clean. Local dry run on
      # this branch found no leaks across 60 commits + the working tree, so any
      # hit here is a real regression that should block the merge.
      # Run the gitleaks binary directly rather than gitleaks-action: the
      # action calls the GitHub API to post PR summaries and fails with
      # "Resource not accessible by integration" without a permissions block.
      # The binary needs no API access and is a clean hard gate (exit 1 on leak).
      - name: gitleaks (secret scan)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner

  docker-python315:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: sentinel_idempotency_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_idempotency_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://sentinel:ci-disposable-only@127.0.0.1:5432/sentinel_idempotency_test_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      SENTINEL_IDEMPOTENCY_TEST_DATABASE_URL: postgresql+asyncpg://sentinel:ci-disposable-only@127.0.0.1:5432/sentinel_idempotency_test_ci
      SENTINEL_IDEMPOTENCY_TEST_ALLOW_SCHEMA_CREATE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5aeca6d2db5bd02e3b8cef1983f2da005def1bbc
          fetch-depth: 2
      - name: Verify integration commit and parents
        run: |
          test "$(git rev-parse HEAD)" = "5aeca6d2db5bd02e3b8cef1983f2da005def1bbc"
          test "$(git show -s --format=%P HEAD)" = "4ea8eb1daad26d6ed847448ed48c901a38c424a6 aca92295a91cc41d5b94a6d62ad733831d8ac2ce"
          git show -s --format="%H %P"
          git status --porcelain
      - name: Build unchanged Dockerfile with pinned Python 3.15 image
        run: docker build --pull --no-cache --progress=plain -t sentinel-pr49-validation .
      - name: Verify Python version and installed production dependencies
        run: |
          docker run --rm sentinel-pr49-validation python -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 15)'
          docker run --rm sentinel-pr49-validation pip check
          docker run --rm sentinel-pr49-validation pip freeze
      - name: Run production CMD migrations and health smoke test
        run: |
          docker run -d --name sentinel-pr49-runtime --network host -e DATABASE_URL -e REDIS_URL -e PORT=18000 sentinel-pr49-validation
          python - <<'CHECK'
          import json
          import time
          import urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=2) as response:
                      data = json.load(response)
                  assert data == {'status': 'ok', 'bus': True}, data
                  print('Python 3.15 production runtime health:', data)
                  break
              except Exception:
                  if attempt == 59:
                      raise
                  time.sleep(1)
          with urllib.request.urlopen('http://127.0.0.1:18000/openapi.json', timeout=5) as response:
              spec = json.load(response)
          assert '/v1/approvals' in spec['paths'], spec['paths'].keys()
          print('OpenAPI served:', spec['info'])
          CHECK
          docker exec sentinel-pr49-runtime alembic current
          docker logs sentinel-pr49-runtime
          docker stop sentinel-pr49-runtime
      - name: Run test suite in Python 3.15 image including disposable PostgreSQL tests
        run: |
          docker run --rm --network host \
            -e DATABASE_URL -e REDIS_URL \
            -e SENTINEL_IDEMPOTENCY_TEST_DATABASE_URL \
            -e SENTINEL_IDEMPOTENCY_TEST_ALLOW_SCHEMA_CREATE \
            sentinel-pr49-validation sh -ec 'pip install --no-cache-dir -e ".[dev]"; pip check; python --version; pytest -q -rs --cov=app --cov-report=term-missing'
      - name: Runtime logs and cleanup
        if: always()
        run: |
          docker logs sentinel-pr49-runtime 2>&1 || true
          docker rm -f sentinel-pr49-runtime 2>/dev/null || true
