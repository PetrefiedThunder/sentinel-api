name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install --upgrade pip uv

      - name: Sync deps
        run: uv pip install --system -e ".[dev]"

      - name: Install aiosqlite (migration tests)
        run: pip install aiosqlite

      - name: Ruff check
        run: ruff check .

      - name: Pytest (with coverage gate)
        run: pytest -q --cov=app --cov-report=term-missing
